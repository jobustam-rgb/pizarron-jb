  });

  // ======================================================================
  // PROCESO: RegistroServiceWorker
  // Habilita el uso sin conexión y es requisito técnico para que el
  // navegador considere la app "instalable".
  // ======================================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('No se pudo registrar el service worker:', err));
    });
  }

  // ======================================================================
  // MÓDULO: GestorCuaderno
  // Permite trabajar con varias "hojas" (páginas) tipo pestañas, y guardar/
  // abrir el cuaderno completo como un archivo .job (JSON), de modo que
  // se pueda cerrar el navegador y retomar el trabajo después.
  // ======================================================================
  let paginas = [];
  let paginaActivaIndex = 0;
  let contadorPaginas = 0;

  function crearPaginaVacia(nombre) {
    contadorPaginas++;
    return {
      nombre: nombre || ('Página ' + contadorPaginas),
      fondo: '#d9e8f5',
      dibujo: null // dataURL PNG del contenido; null = página en blanco
    };
  }

  function actualizarSwatchFondoSeleccionado(color) {
    const c = (color || '#ffffff').toLowerCase();
    swatchesFondo.forEach(s => s.classList.toggle('seleccionado', s.dataset.color.toLowerCase() === c));
  }

  // Guarda el contenido actual del lienzo dentro de los datos de la página activa
  function ProcesoGuardarPaginaActual() {
    if (!paginas[paginaActivaIndex]) return;
    paginas[paginaActivaIndex].dibujo = Pizarra.getCanvasPrincipal().toDataURL('image/png');
    paginas[paginaActivaIndex].fondo = Pizarra.getColorFondo();
  }

  // Carga en el lienzo el contenido guardado de la página indicada
  function ProcesoCargarPagina(index) {
    const pagina = paginas[index];
    if (!pagina) return;
    paginaActivaIndex = index;

    Pizarra.setFondo(pagina.fondo || '#ffffff');
    actualizarSwatchFondoSeleccionado(pagina.fondo || '#ffffff');

    // Limpiar lápiz temporal al cambiar de hoja (es efímero, no pertenece a ninguna página)
    Pizarra.limpiarTemporal();
    desactivarVisualLapizTemporal();

    const canvasP = Pizarra.getCanvasPrincipal();
    const ctxDeCarga = canvasP.getContext('2d');
    ctxDeCarga.clearRect(0, 0, canvasP.width, canvasP.height);

    if (pagina.dibujo) {
      const img = new Image();
      img.onload = () => {
        ctxDeCarga.drawImage(img, 0, 0);
        Pizarra.inicializarHistorial();
        if (typeof emitirContenidoCompleto === 'function') emitirContenidoCompleto();
      };
      img.src = pagina.dibujo;
    } else {
      Pizarra.inicializarHistorial();
      if (typeof emitirContenidoCompleto === 'function') emitirContenidoCompleto();
    }

    RenderizarPestanas();
  }

  function ProcesoCambiarPagina(index) {
    if (index === paginaActivaIndex) return;
    ProcesoGuardarPaginaActual();
    ProcesoCargarPagina(index);
  }

  function ProcesoNuevaPagina() {
    ProcesoGuardarPaginaActual();
    paginas.push(crearPaginaVacia());
    ProcesoCargarPagina(paginas.length - 1);
  }

  function ProcesoEliminarPagina(index, evento) {
    if (evento) evento.stopPropagation();
    if (paginas.length <= 1) {
      alert('El cuaderno debe tener al menos una página.');
      return;
    }
    const nombre = paginas[index].nombre;
    if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`)) return;

    paginas.splice(index, 1);

    if (paginaActivaIndex === index) {
      ProcesoCargarPagina(Math.max(0, index - 1));
    } else {
      if (paginaActivaIndex > index) paginaActivaIndex--;
      RenderizarPestanas();
    }
  }

  function RenderizarPestanas() {
    barraPestanas.innerHTML = '';
    paginas.forEach((pagina, i) => {
      const tab = document.createElement('div');
      tab.className = 'pestana' + (i === paginaActivaIndex ? ' activa' : '');
      tab.innerHTML = `<span>${pagina.nombre}</span><span class="cerrar-pestana" title="Eliminar página">&times;</span>`;
      tab.addEventListener('click', () => ProcesoCambiarPagina(i));
      tab.querySelector('.cerrar-pestana').addEventListener('click', (e) => ProcesoEliminarPagina(i, e));
      barraPestanas.appendChild(tab);
    });

    const btnNueva = document.createElement('div');
    btnNueva.className = 'btn-nueva-pestana';
    btnNueva.title = 'Nueva página';
    btnNueva.innerHTML = '<i class="fas fa-plus"></i>';
    btnNueva.addEventListener('click', () => ProcesoNuevaPagina());
    barraPestanas.appendChild(btnNueva);
  }

  // ===== Guardar cuaderno completo como archivo .job =====
  function ProcesoGuardarCuaderno() {
    ProcesoGuardarPaginaActual();
    const cuaderno = {
      tipo: 'cuaderno-pizarra-jb',
      version: 1,
      autor: 'Mat. Edgar Johni Bustamante Romero, Ph.D.',
      fecha: new Date().toISOString(),
      paginaActivaIndex,
      paginas: paginas.map(p => ({ nombre: p.nombre, fondo: p.fondo, dibujo: p.dibujo }))
    };
    const blob = new Blob([JSON.stringify(cuaderno)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const marca = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    const a = document.createElement('a');
    a.href = url;
    a.download = `cuaderno-pizarra-${marca}.job`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // ===== Abrir cuaderno desde archivo .job (compatible también con .pizarra) =====
  function ProcesoAbrirCuaderno(file) {
    if (!file) return;
    const lector = new FileReader();
    lector.onload = (e) => {
      try {
        const datos = JSON.parse(e.target.result);
        if (!datos || !Array.isArray(datos.paginas) || datos.paginas.length === 0) {
          alert('El archivo no parece un cuaderno válido de esta pizarra.');
          return;
        }
        paginas = datos.paginas.map((p, i) => ({
          nombre: p.nombre || ('Página ' + (i + 1)),
          fondo: p.fondo || '#ffffff',
          dibujo: p.dibujo || null
        }));
        contadorPaginas = paginas.length;
        const indiceInicial = Number.isInteger(datos.paginaActivaIndex)
          ? Math.min(Math.max(datos.paginaActivaIndex, 0), paginas.length - 1)
          : 0;
        ProcesoCargarPagina(indiceInicial);
      } catch (err) {
        alert('No se pudo abrir el cuaderno: el archivo está dañado o no tiene el formato correcto.');
      }
    };
    lector.readAsText(file);
  }

  bindButton(btnGuardarCuaderno, () => ProcesoGuardarCuaderno());
  bindButton(btnAbrirCuaderno, () => inputAbrirCuaderno.click());
  inputAbrirCuaderno.addEventListener('change', (e) => {
    const file = e.target.files[0];
    ProcesoAbrirCuaderno(file);
    inputAbrirCuaderno.value = '';
  });

  // ======================================================================
  // PROCESO: ProcesoToggleBarraSuperior
  // Contrae/expande el menú horizontal para liberar espacio en pantalla.
  // ======================================================================
  function ProcesoToggleBarraSuperior() {
    const contraido = iconosBarraSuperior.classList.toggle('contraida');
    btnToggleBarraSuperior.classList.toggle('contraido', contraido);
    separadorToggle.style.display = contraido ? 'none' : 'block';
    btnToggleBarraSuperior.title = contraido ? 'Expandir menú' : 'Contraer menú';
  }
  bindButton(btnToggleBarraSuperior, () => ProcesoToggleBarraSuperior());

  // ======================================================================
  // PROCESO: ProcesoPantallaCompleta
  // Activa/desactiva el modo de pantalla completa del navegador.
  // ======================================================================
  function ProcesoPantallaCompleta() {
    const elemento = document.documentElement;
    const enPantallaCompleta = document.fullscreenElement || document.webkitFullscreenElement;

    if (!enPantallaCompleta) {
      const solicitar = elemento.requestFullscreen || elemento.webkitRequestFullscreen;
      if (solicitar) {
        solicitar.call(elemento).catch(err => {
          alert('No se pudo activar la pantalla completa: ' + err.message);
        });
      }
    } else {
      const salir = document.exitFullscreen || document.webkitExitFullscreen;
      if (salir) salir.call(document);
    }
  }
  bindButton(btnPantallaCompleta, () => ProcesoPantallaCompleta());

  function actualizarIconoPantallaCompleta() {
    const activo = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const icono = btnPantallaCompleta.querySelector('i');
    icono.className = activo ? 'fas fa-compress' : 'fas fa-expand';
    btnPantallaCompleta.title = activo ? 'Salir de pantalla completa' : 'Modo pantalla completa';
  }
  document.addEventListener('fullscreenchange', actualizarIconoPantallaCompleta);
  document.addEventListener('webkitfullscreenchange', actualizarIconoPantallaCompleta);

  // ===== Herramienta "Neutro" =====
  // Botón en blanco: al activarlo, ninguna herramienta de dibujo queda
  // seleccionada. El lienzo no reacciona a clics ni trazos: es un estado
  // de "pausa" para mover la vista o simplemente no dibujar por accidente.
  bindButton(btnNeutro, () => setTool('neutro', btnNeutro));

  // ======================================================================
  // PROCESO: ProcesoAjustarPantalla
  // Escala todo el pizarrón (menús + hoja + pestañas) para que quepa por
  // completo en la ventana visible, sin importar el tamaño de pantalla.
  // Así se elimina la necesidad de cualquier deslizador (scroll) del
  // sistema, tanto vertical como horizontal.
  // ======================================================================
  const pizarraWrapper = document.querySelector('.pizarra-wrapper');
  let anchoNaturalWrapper = null;
  let altoNaturalWrapper = null;

  function ProcesoAjustarPantalla() {
    if (anchoNaturalWrapper === null) {
      const transformPrevia = pizarraWrapper.style.transform;
      pizarraWrapper.style.transform = 'none';
      const rect = pizarraWrapper.getBoundingClientRect();
      anchoNaturalWrapper = rect.width;
      altoNaturalWrapper = rect.height;
      pizarraWrapper.style.transform = transformPrevia;
    }

    const margen = 16; // pequeño respiro para que no quede pegado a los bordes
    const escalaAncho = (window.innerWidth - margen) / anchoNaturalWrapper;
    const escalaAlto = (window.innerHeight - margen) / altoNaturalWrapper;
    const escala = Math.min(1, escalaAncho, escalaAlto); // nunca agranda más allá del 100%

    pizarraWrapper.style.transform = `scale(${escala})`;
  }

  window.addEventListener('resize', ProcesoAjustarPantalla);
  window.addEventListener('orientationchange', ProcesoAjustarPantalla);
  window.addEventListener('load', ProcesoAjustarPantalla);
  ProcesoAjustarPantalla();

  // ===== Título con fecha actual (versión) =====
  (function actualizarTituloConFecha() {
    const hoy = new Date();
    const dd = String(hoy.getDate()).padStart(2, '0');
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');
    const yyyy = hoy.getFullYear();
    document.title = `Pizarra JoBustamante [v: ${dd}/${mm}/${yyyy}]`;
  })();

  // ======================================================================
  // MÓDULO: Lupa (efecto de aumento circular)
  // Muestra, mientras se arrastra el dedo/mouse con la herramienta activa,
  // un círculo de radio ~2cm con una vista aumentada de esa zona exacta
  // del pizarrón (fondo + dibujo + lápiz temporal + cuadrícula).
  // ======================================================================
  const LUPA_RADIO_CM = 2;
  const PX_POR_CM = 37.8; // aproximación estándar: 96px/pulgada ÷ 2.54cm/pulgada
  const LUPA_RADIO_PX = Math.round(LUPA_RADIO_CM * PX_POR_CM); // ≈ 76px
  const LUPA_DIAMETRO_PX = LUPA_RADIO_PX * 2;
  const LUPA_ZOOM = 2.2; // cuánto se aumenta el contenido dentro de la lupa

  // Tamaño físico del lente (constante, independiente del zoom del lienzo)
  lupaOverlay.style.width = LUPA_DIAMETRO_PX + 'px';
  lupaOverlay.style.height = LUPA_DIAMETRO_PX + 'px';
  lupaCanvas.width = LUPA_DIAMETRO_PX;
  lupaCanvas.height = LUPA_DIAMETRO_PX;

  let lupaArrastrando = false;

  function ProcesoActivarLupa() {
    const yaActiva = btnLupa.classList.contains('activo');
    if (yaActiva) {
      btnLupa.classList.remove('activo');
      lupaOverlay.style.display = 'none';
      setTool('lapiz', btnLapiz);
      return;
    }
    setTool('lupa', btnLupa);
  }
  bindButton(btnLupa, () => ProcesoActivarLupa());

  // Si se activa cualquier otra herramienta del menú vertical, ocultar la lupa
  barraLateral.addEventListener('click', () => {
    if (!btnLupa.classList.contains('activo')) {
      lupaOverlay.style.display = 'none';
      lupaArrastrando = false;
    }
  });

  function coordenadasLupa(e) {
    const rect = contenedor.getBoundingClientRect();
    const scaleX = Pizarra.W / rect.width;
    const scaleY = Pizarra.H / rect.height;
    let cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX; cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length) {
      cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
    } else {
      cx = e.clientX; cy = e.clientY;
    }
    const xLocal = (cx - rect.left) * scaleX; // posición dentro del contenedor (para ubicar el lente)
    const yLocal = (cy - rect.top) * scaleY;
    const { zoom, panX, panY } = Pizarra.getTransform();
    const xCanvas = (xLocal - panX) / zoom; // posición real en el lienzo (para recortar el contenido)
    const yCanvas = (yLocal - panY) / zoom;
    return { xLocal, yLocal, xCanvas, yCanvas };
  }

  function dibujarLupa(xCanvas, yCanvas) {
    const { zoom } = Pizarra.getTransform();
    // Si el lienzo ya está con zoom aplicado, cada píxel del canvas ocupa
    // más (o menos) espacio en pantalla; hay que compensarlo para que el
    // aumento de la lupa sea siempre el mismo, sin importar el zoom del lienzo.
    const radioFuente = LUPA_RADIO_PX / (LUPA_ZOOM * zoom);
    const sx = xCanvas - radioFuente;
    const sy = yCanvas - radioFuente;
    const s = radioFuente * 2;

    ctxLupa.clearRect(0, 0, LUPA_DIAMETRO_PX, LUPA_DIAMETRO_PX);
    // Se recompone en el mismo orden visual: fondo → dibujo → lápiz temporal → cuadrícula
    [Pizarra.getCanvasFondo(), Pizarra.getCanvasPrincipal(), Pizarra.getCanvasTemporal(), Pizarra.getCanvasGrid()]
      .forEach(capa => ctxLupa.drawImage(capa, sx, sy, s, s, 0, 0, LUPA_DIAMETRO_PX, LUPA_DIAMETRO_PX));
  }

  function actualizarLupa(e) {
    const { xLocal, yLocal, xCanvas, yCanvas } = coordenadasLupa(e);
    lupaOverlay.style.left = (xLocal - LUPA_RADIO_PX) + 'px';
    lupaOverlay.style.top = (yLocal - LUPA_RADIO_PX) + 'px';
    dibujarLupa(xCanvas, yCanvas);
  }

  function lupaPointerDown(e) {
    if (!btnLupa.classList.contains('activo')) return;
    lupaArrastrando = true;
    lupaOverlay.style.display = 'block';
    actualizarLupa(e);
  }
  function lupaPointerMove(e) {
    if (!btnLupa.classList.contains('activo') || !lupaArrastrando) return;
    actualizarLupa(e);
  }
  function lupaPointerUp() {
    lupaArrastrando = false;
    if (btnLupa.classList.contains('activo')) lupaOverlay.style.display = 'none';
  }

  contenedor.addEventListener('mousedown', lupaPointerDown);
  contenedor.addEventListener('touchstart', lupaPointerDown, { passive: false });
  window.addEventListener('mousemove', lupaPointerMove);
  window.addEventListener('touchmove', lupaPointerMove, { passive: false });
  window.addEventListener('mouseup', lupaPointerUp);
  window.addEventListener('touchend', lupaPointerUp);

  // ======================================================================
  // MÓDULO: PizarronEspejo
  // Sincroniza el contenido y un marcador de posición con una segunda
  // pestaña ("Pizarrón 2"), pensada para mostrar a los estudiantes una
  // vista limpia mientras el profesor trabaja cómodamente en el Pizarrón 1.
  // ======================================================================
  const CM_A_PX = 37.795; // aproximación estándar 96dpi (1cm ≈ 37.795 px)
  const MARCADOR_ANCHO_TABLERO = 3 * CM_A_PX;   // 3cm de largo (horizontal)
  const MARCADOR_ALTO_TABLERO = 1.5 * CM_A_PX;  // 1.5cm de ancho (vertical)

  const CANAL_SYNC = 'pizarron-jb-sync';
  const CLAVE_CONTENIDO = 'pizarron_jb_sync_contenido';
  const CLAVE_MARCADOR = 'pizarron_jb_sync_marcador';

  const canalSync = ('BroadcastChannel' in window) ? new BroadcastChannel(CANAL_SYNC) : null;
  let marcadorVisible = false;

  // Compone fondo + dibujo + lápiz temporal en una sola imagen plana,
  // igual que se hace para imprimir: así el Pizarrón 2 solo necesita
  // mostrar una <img>, sin tener que recomponer capas.
  function generarImagenPlanaActual(callback) {
    const canvasExport = document.createElement('canvas');
    canvasExport.width = Pizarra.W;
    canvasExport.height = Pizarra.H;
    const ctxExport = canvasExport.getContext('2d');
    ctxExport.fillStyle = Pizarra.getColorFondo() || '#ffffff';
    ctxExport.fillRect(0, 0, Pizarra.W, Pizarra.H);
    ctxExport.drawImage(Pizarra.getCanvasPrincipal(), 0, 0);
    ctxExport.drawImage(Pizarra.getCanvasTemporal(), 0, 0);
    callback(canvasExport.toDataURL('image/png'));
  }

  function emitirContenidoCompleto() {
    generarImagenPlanaActual((imagen) => {
      const datos = { tipo: 'contenido', imagen, ts: Date.now() };
      if (canalSync) canalSync.postMessage(datos);
      try { localStorage.setItem(CLAVE_CONTENIDO, JSON.stringify(datos)); } catch (e) { /* almacenamiento no disponible */ }
    });
  }

  function emitirMarcadorCompleto() {
    const centro = Pizarra.getPuntoDeCentroEnTablero();
    const datos = {
      tipo: 'marcador',
      x: centro.x, y: centro.y,
      ancho: MARCADOR_ANCHO_TABLERO, alto: MARCADOR_ALTO_TABLERO,
      visible: marcadorVisible,
      ts: Date.now()
    };
    if (canalSync) canalSync.postMessage(datos);
    try { localStorage.setItem(CLAVE_MARCADOR, JSON.stringify(datos)); } catch (e) { /* almacenamiento no disponible */ }
  }

  // Dibuja (o esconde) el marcador también en el propio Pizarrón 1
  function dibujarMarcadorLocal() {
    ctxMarcador.clearRect(0, 0, Pizarra.W, Pizarra.H);
    if (!marcadorVisible) {
      canvasMarcador.style.display = 'none';
      return;
    }
    canvasMarcador.style.display = 'block';
    const centro = Pizarra.getPuntoDeCentroEnTablero();
    const x = centro.x - MARCADOR_ANCHO_TABLERO / 2;
    const y = centro.y - MARCADOR_ALTO_TABLERO / 2;
    ctxMarcador.save();
    ctxMarcador.fillStyle = 'rgba(37, 99, 235, 0.14)';
    ctxMarcador.strokeStyle = 'rgba(37, 99, 235, 0.55)';
    ctxMarcador.lineWidth = 2;
    const r = 10;
    ctxMarcador.beginPath();
    ctxMarcador.roundRect(x, y, MARCADOR_ANCHO_TABLERO, MARCADOR_ALTO_TABLERO, r);
    ctxMarcador.fill();
    ctxMarcador.stroke();
    ctxMarcador.restore();
  }

  // ===== Conectar los hooks del módulo Pizarra =====
  Pizarra.setOnCambioContenido(() => emitirContenidoCompleto());
  Pizarra.setOnCambioTransform(() => {
    if (!marcadorVisible) return;
    dibujarMarcadorLocal();
    emitirMarcadorCompleto();
  });

  // Mientras se está trazando (pincel, resaltador, lápiz temporal, formas...)
  // se transmite periódicamente, para que el Pizarrón 2 vea el trazo
  // avanzar casi en vivo, no solo el resultado final al soltar el clic.
  setInterval(() => {
    if (Pizarra.estaDibujando()) emitirContenidoCompleto();
  }, 150);

  // ===== Botón: Abrir Pizarrón 2 en otra pestaña =====
  function ProcesoAbrirPizarron2() {
    window.open('pizarron2.html', '_blank');
    // Pequeño respiro y luego reenviar el estado completo, para que la
    // pestaña recién abierta reciba contenido aunque llegue tarde al canal.
    setTimeout(() => {
      emitirContenidoCompleto();
      emitirMarcadorCompleto();
    }, 800);
  }
  bindButton(btnAbrirPizarron2, () => ProcesoAbrirPizarron2());

  // ===== Botón: Actualizar (fuerza reenvío) + mostrar/ocultar marcador =====
  function ProcesoActualizarYMarcador() {
    marcadorVisible = !marcadorVisible;
    btnActualizarMarcador.classList.toggle('activo', marcadorVisible);
    dibujarMarcadorLocal();
    emitirContenidoCompleto();
    emitirMarcadorCompleto();
  }
  bindButton(btnActualizarMarcador, () => ProcesoActualizarYMarcador());

  // ===== Inicialización =====
  Pizarra.setHerramienta('lapiz', 'principal');
  Pizarra.setColor('#1a1a1a');
  Pizarra.setGrosor(3, 'principal');
  Pizarra.setOpacidad(100, 'principal');
  Pizarra.setFondo('#d9e8f5');
  panelLapiz.classList.add('visible');
  panelLapiz.style.display = 'flex';
  posicionarPanel(btnLapiz, panelLapiz);

  Pizarra.inicializarHistorial();

  [toggleGrupo1, toggleGrupo2].forEach(t => t.querySelector('i:first-child').className = 'fas fa-chevron-down');
  selectorCP.actualizarBotonCopiar();

  // El cuaderno arranca con una sola página en blanco (la que ya está dibujada)
  paginas = [crearPaginaVacia('Página 1')];
  paginaActivaIndex = 0;
  RenderizarPestanas();

  console.log('✅ Versión final: Manita y CP funcionan de forma independiente.');
})();
</script>
</body>
