      posicionarPanel(btn, panel);
    }
  }

  // ===== Activar herramienta =====
  function setTool(tool, btn) {
    // CP: selección unificada (mover, redimensionar, copiar, pegar, eliminar)
    if (tool === 'cp') {
      const isActive = btn.classList.contains('activo');
      if (isActive) {
        selectorCP.desactivar();
        btn.classList.remove('activo');
        setTool('lapiz', btnLapiz);
      } else {
        document.querySelectorAll('.barra-lateral .btn-icon[data-herramienta]').forEach(b => b.classList.remove('activo'));
        btnLapiz.classList.remove('activo');
        btn.classList.add('activo');
        Pizarra.setHerramienta('cp', 'principal');
        selectorCP.activar();
        cerrarPaneles();
      }
      return;
    }

    // Si CP está activo, desactivarlo
    if (selectorCP.activo) {
      selectorCP.desactivar();
      btnCP.classList.remove('activo');
    }

    // Resto de herramientas
    if (tool === 'lapiz' && btnLapiz.classList.contains('activo')) {
      togglePanel(btnLapiz, panelLapiz);
      return;
    }
    if (tool === 'resaltador' && btnResaltador.classList.contains('activo')) {
      togglePanel(btnResaltador, panelResaltador);
      return;
    }
    if (tool === 'goma' && btnGoma.classList.contains('activo')) {
      togglePanel(btnGoma, panelGoma);
      return;
    }

    Pizarra.setHerramienta(tool, 'principal');
    document.querySelectorAll('.barra-lateral .btn-icon[data-herramienta]').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    cerrarPaneles();

    if (tool === 'lapiz') {
      panelLapiz.classList.add('visible');
      panelLapiz.style.display = 'flex';
      posicionarPanel(btnLapiz, panelLapiz);
    } else if (tool === 'resaltador') {
      panelResaltador.classList.add('visible');
      panelResaltador.style.display = 'flex';
      posicionarPanel(btnResaltador, panelResaltador);
    } else if (tool === 'goma') {
      panelGoma.classList.add('visible');
      panelGoma.style.display = 'flex';
      posicionarPanel(btnGoma, panelGoma);
    } else if (tool === 'fondo') {
      panelFondo.classList.add('visible');
      panelFondo.style.display = 'flex';
      posicionarPanel(btnFondo, panelFondo);
    }
    Pizarra.actualizarBotonesHistorial();
  }

  // ===== Proceso: ProcesoActivarLapizTemporal =====
  // Activa la herramienta de anotación temporal (capa efímera, no forma
  // parte del historial de deshacer/rehacer). Un segundo clic con la
  // herramienta ya activa solo abre/cierra el panel de colores.
  function ProcesoActivarLapizTemporal() {
    const isActive = btnLapizTemporal.classList.contains('activo');
    if (isActive) {
      togglePanel(btnLapizTemporal, panelLapizTemporal);
      return;
    }
    if (selectorCP.activo) { selectorCP.desactivar(); btnCP.classList.remove('activo'); }
    document.querySelectorAll('.barra-lateral .btn-icon[data-herramienta]').forEach(b => b.classList.remove('activo'));
    cerrarPaneles();

    Pizarra.setHerramienta('lapizTemporal', 'temporal');
    btnLapizTemporal.classList.add('activo');
    panelLapizTemporal.classList.add('visible');
    panelLapizTemporal.style.display = 'flex';
    posicionarPanel(btnLapizTemporal, panelLapizTemporal);
  }

  // ===== Proceso: ProcesoLimpiarLapizTemporal =====
  // Borra únicamente lo dibujado con el lápiz temporal (capa efímera),
  // sin afectar el contenido principal ni el historial.
  function ProcesoLimpiarLapizTemporal() {
    Pizarra.limpiarTemporal();
  }

  // ===== Proceso: desactivar visualmente el lápiz temporal =====
  function desactivarVisualLapizTemporal() {
    if (btnLapizTemporal.classList.contains('activo')) {
      btnLapizTemporal.classList.remove('activo');
      panelLapizTemporal.classList.remove('visible');
      panelLapizTemporal.style.display = 'none';
    }
  }

  // ===== Enlace de botones =====
  function bindButton(btn, handler) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); this.click(); }, { passive: false });
  }

  bindButton(btnLapiz, () => setTool('lapiz', btnLapiz));
  bindButton(btnResaltador, () => setTool('resaltador', btnResaltador));
  bindButton(btnGoma, () => setTool('goma', btnGoma));
  bindButton(btnLinea, () => setTool('linea', btnLinea));
  bindButton(btnRectangulo, () => setTool('rectangulo', btnRectangulo));
  bindButton(btnCP, () => setTool('cp', btnCP));
  bindButton(btnFondo, () => setTool('fondo', btnFondo));
  bindButton(btnGrid, () => { const est = Pizarra.toggleGrid(); btnGrid.classList.toggle('activo', est); });
  bindButton(btnMover, () => { if (btnMover.classList.contains('activo')) setTool('lapiz', btnLapiz); else setTool('mover', btnMover); });
  // --- Botones de Zoom con actualización del indicador ---
  bindButton(btnZoomIn, () => {
    Pizarra.zoomIn();
    actualizarIndicadorZoom();
  });
  bindButton(btnZoomOut, () => {
    Pizarra.zoomOut();
    actualizarIndicadorZoom();
  });

  // ======================================================================
  // PROCESO: ProcesoRestablecerVista
  // Primer clic: guarda la vista actual (zoom + posición) y la restablece
  // al tamaño/ubicación inicial (zoom 1, sin desplazamiento — la misma
  // vista "de fábrica" con la que arranca el Pizarrón 2).
  // Segundo clic: restaura la vista que tenías justo antes de resetear.
  // ======================================================================
  let vistaGuardadaAntesDeReset = null;

  function ProcesoRestablecerVista() {
    if (vistaGuardadaAntesDeReset === null) {
      vistaGuardadaAntesDeReset = Pizarra.getTransform();
      Pizarra.setTransformCompleta(1, 0, 0);
      btnRestablecerVista.classList.add('activo');
      btnRestablecerVista.title = 'Volver a la vista anterior';
    } else {
      const v = vistaGuardadaAntesDeReset;
      Pizarra.setTransformCompleta(v.zoom, v.panX, v.panY);
      vistaGuardadaAntesDeReset = null;
      btnRestablecerVista.classList.remove('activo');
      btnRestablecerVista.title = 'Restablecer vista al tamaño inicial';
    }
    actualizarIndicadorZoom();
  }
  bindButton(btnRestablecerVista, () => ProcesoRestablecerVista());
  bindButton(btnDeshacer, () => { Pizarra.deshacer(); Pizarra.actualizarBotonesHistorial(); });
  bindButton(btnRehacer, () => { Pizarra.rehacer(); Pizarra.actualizarBotonesHistorial(); });
  bindButton(btnImprimir, () => ProcesoImprimirPizarra());
  bindButton(btnLapizTemporal, () => ProcesoActivarLapizTemporal());
  bindButton(btnBorrarTemporal, () => ProcesoLimpiarLapizTemporal());

  // ===== Regla: activar cualquier herramienta del menú vertical =====
  // borra automáticamente lo dibujado con el lápiz temporal.
  barraLateral.addEventListener('click', e => {
    if (e.target.closest('.btn-icon')) {
      Pizarra.limpiarTemporal();
      desactivarVisualLapizTemporal();
    }
  });

  // ===== Selección de color del lápiz temporal =====
  coloresLapizTemporal.forEach(sw => {
    sw.addEventListener('click', e => {
      e.stopPropagation();
      Pizarra.setColorTemporal(sw.dataset.color);
      coloresLapizTemporal.forEach(s => s.classList.remove('seleccionado'));
      sw.classList.add('seleccionado');
      cerrarPaneles();
    });
    sw.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); sw.click(); }, { passive: false });
  });

  // ===== Acciones del panel CP =====
  function bindActionCP(btn, actionFn) {
    btn.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (btn.disabled) return;
      actionFn();
    });
    btn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (btn.disabled) return;
      actionFn();
    }, { passive: false });
  }

  bindActionCP(btnCopiarCP, () => selectorCP.copiar());
  bindActionCP(btnCortarCP, () => selectorCP.cortar());
  bindActionCP(btnPegarCP, () => {
    selectorCP.pegar(() => {
      setTool('lapiz', btnLapiz);
    });
  });
  bindActionCP(btnEliminarCP, () => {
    selectorCP.eliminar(() => {
      setTool('lapiz', btnLapiz);
    });
  });

  // ===== Configuración lápiz, resaltador, fondo =====
  colorSwatchesLapiz.forEach(sw => {
    sw.addEventListener('click', e => { e.stopPropagation(); Pizarra.setColor(sw.dataset.color); colorSwatchesLapiz.forEach(s => s.classList.remove('seleccionado')); sw.classList.add('seleccionado'); cerrarPaneles(); });
    sw.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); sw.click(); }, { passive: false });
  });
  grosorBtnsLapiz.forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); Pizarra.setGrosor(btn.dataset.size, 'principal'); grosorBtnsLapiz.forEach(b => b.classList.remove('seleccionado')); btn.classList.add('seleccionado'); cerrarPaneles(); });
    btn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); btn.click(); }, { passive: false });
  });
  colorSwatchesResaltador.forEach(sw => {
    sw.addEventListener('click', e => { e.stopPropagation(); Pizarra.setResaltadorColor(sw.dataset.color); colorSwatchesResaltador.forEach(s => s.classList.remove('seleccionado')); sw.classList.add('seleccionado'); cerrarPaneles(); });
    sw.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); sw.click(); }, { passive: false });
  });
  grosorBtnsResaltador.forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); Pizarra.setResaltadorGrosor(btn.dataset.size); grosorBtnsResaltador.forEach(b => b.classList.remove('seleccionado')); btn.classList.add('seleccionado'); cerrarPaneles(); });
    btn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); btn.click(); }, { passive: false });
  });
  grosorBtnsGoma.forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); Pizarra.setGrosorGoma(btn.dataset.size); grosorBtnsGoma.forEach(b => b.classList.remove('seleccionado')); btn.classList.add('seleccionado'); cerrarPaneles(); });
    btn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); btn.click(); }, { passive: false });
  });
  swatchesFondo.forEach(sw => {
    sw.addEventListener('click', e => { e.stopPropagation(); Pizarra.setFondo(sw.dataset.color); swatchesFondo.forEach(s => s.classList.remove('seleccionado')); sw.classList.add('seleccionado'); cerrarPaneles(); });
    sw.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); sw.click(); }, { passive: false });
  });

  // ===== Cerrar paneles al clic fuera =====
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.floating-panel') && !e.target.closest('.btn-icon')) {
      cerrarPaneles();
    }
  });

  // ======================================================================
  // PROCESO: ProcesoImprimirPizarra (VERSIÓN FUNCIONAL EXTRAÍDA DE index_0.html)
  // Genera una vista de impresión limpia (sin barras ni controles),
  // usando el contenido actual del canvas principal, con marca de autoría.
  // ======================================================================
  // [REEMPLAZO COMPLETO DE LAS FUNCIONES DE IMPRESIÓN]
  // ======================================================================
  function ProcesoGuardarPaginaActual() {
    if (!paginas[paginaActivaIndex]) return;
    paginas[paginaActivaIndex].dibujo = Pizarra.getCanvasPrincipal().toDataURL('image/png');
    paginas[paginaActivaIndex].fondo = Pizarra.getColorFondo();
  }

  function ProcesoImprimirPizarra() {
    // Asegurar que la página visible en este momento quede guardada en el
    // arreglo de páginas antes de armar la impresión completa.
    ProcesoGuardarPaginaActual();

    const anchoCanvas = Pizarra.W;
    const altoCanvas = Pizarra.H;
    const fecha = new Date().toLocaleDateString('es-EC', { year: 'numeric', month: 'long', day: 'numeric' });
    const totalPaginas = paginas.length;

    const ventana = window.open('', '_blank');
    if (!ventana) {
      alert('El navegador bloqueó la ventana de impresión. Por favor habilita las ventanas emergentes.');
      return;
    }

    const hojasHtml = new Array(totalPaginas);
    let hojasListas = 0;

    function escribirVentanaSiListo() {
      if (hojasListas < totalPaginas) return;

      ventana.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8">
          <title>Impresión · Cuaderno Pizarra</title>
          <style>
            @page { size: landscape; margin: 12mm; }
            * { margin:0; padding:0; box-sizing:border-box; }
            body {
              font-family: 'Segoe UI', Arial, sans-serif;
              display:flex;
              flex-direction:column;
              align-items:center;
              padding: 20px;
            }
            .hoja {
              width: 100%;
              max-width: 1200px;
              margin-bottom: 20px;
            }
            .encabezado {
              display:flex;
              justify-content:space-between;
              align-items:center;
              border-bottom: 2px solid #1a2634;
              padding-bottom: 8px;
              margin-bottom: 14px;
            }
            .encabezado h1 {
              font-size: 16px;
              color:#1a2634;
              font-weight:600;
            }
            .encabezado span {
              font-size: 12px;
              color:#6a7a8a;
            }
            .imagen-pizarra {
              width: 100%;
              border: 1px solid #d0d7e2;
              border-radius: 8px;
              display:block;
            }
            .pie {
              margin-top: 14px;
              text-align:center;
              font-size: 11px;
              color:#8a97a6;
              letter-spacing: 0.02em;
            }
            @media print {
              body { padding: 0; }
              .encabezado, .pie { color:#000 !important; }
              .hoja { margin-bottom: 0; }
            }
          </style>
        </head>
        <body>
          ${hojasHtml.join('\n')}
          <script>
            window.onload = function() {
              window.focus();
              window.print();
            };
          <\/script>
        </body>
        </html>
      `);
      ventana.document.close();
    }

    paginas.forEach((pagina, index) => {
      // Lienzo temporal por página: fondo sólido + dibujo (por si hay transparencia)
      const canvasExport = document.createElement('canvas');
      canvasExport.width = anchoCanvas;
      canvasExport.height = altoCanvas;
      const ctxExport = canvasExport.getContext('2d');
      ctxExport.fillStyle = pagina.fondo || '#ffffff';
      ctxExport.fillRect(0, 0, anchoCanvas, altoCanvas);

      const construirHoja = () => {
        const imagenDataUrl = canvasExport.toDataURL('image/png');
        const esUltima = index === totalPaginas - 1;
        hojasHtml[index] = `
          <div class="hoja" style="${esUltima ? '' : 'page-break-after: always;'}">
            <div class="encabezado">
              <h1>Pizarra Digital — ${pagina.nombre}</h1>
              <span>${fecha} · Pág. ${index + 1} de ${totalPaginas}</span>
            </div>
            <img class="imagen-pizarra" src="${imagenDataUrl}" alt="Contenido de ${pagina.nombre}">
            <div class="pie">https://sites.google.com/view/pizarron-job/inicio</div>
          </div>
        `;
        hojasListas++;
        escribirVentanaSiListo();
      };

      const dibujarContenidoYTerminar = () => {
        if (pagina.dibujo) {
          const img = new Image();
          img.onload = () => { ctxExport.drawImage(img, 0, 0); construirHoja(); };
          img.src = pagina.dibujo;
        } else {
          construirHoja();
        }
      };

      // El fondo importado (PDF), si esta página tiene uno y el interruptor
      // está activado, se dibuja debajo del contenido, igual que se ve en
      // el Pizarrón 1.
      if (pagina.fondoImagen && mostrarFondoImagenGlobal) {
        const imgFondo = new Image();
        imgFondo.onload = () => { ctxExport.drawImage(imgFondo, 0, 0); dibujarContenidoYTerminar(); };
        imgFondo.src = pagina.fondoImagen;
      } else {
        dibujarContenidoYTerminar();
      }
    });
  }
  // ===== FIN DE REEMPLAZO DE IMPRESIÓN =====

  // ======================================================================
  // PROCESO: ProcesoInstalarPWA
  // El ícono aparece en cuanto el candado está activado (sin esperar a que
  // el navegador dispare su propio aviso de instalación). Al pulsarlo: si
  // el navegador ya tiene lista la instalación nativa, la dispara; si aún
  // no, explica por qué (y qué revisar) en vez de no hacer nada.
  // ======================================================================
  let eventoInstalacionDiferido = null;

  function mostrarBotonInstalarSiCorresponde() {
    const activado = typeof window.estaActivado === 'function' && window.estaActivado();
    if (activado) {
      btnInstalarApp.style.display = 'inline-flex';
      separadorInstalar.style.display = 'block';
    }
  }
  window.mostrarBotonInstalarSiCorresponde = mostrarBotonInstalarSiCorresponde;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    eventoInstalacionDiferido = e;
    mostrarBotonInstalarSiCorresponde();
  });

  bindButton(btnInstalarApp, async () => {
    if (!eventoInstalacionDiferido) {
      alert('Este navegador todavía no ofrece instalar la app en este momento.\n\nRecarga la página, y verifica que estés usando Chrome o Edge sobre HTTPS (o que la app no esté ya instalada).');
      return;
    }
    eventoInstalacionDiferido.prompt();
    await eventoInstalacionDiferido.userChoice;
    eventoInstalacionDiferido = null;
    btnInstalarApp.style.display = 'none';
    separadorInstalar.style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    btnInstalarApp.style.display = 'none';
    separadorInstalar.style.display = 'none';
    console.log('✅ Pizarrón instalado como aplicación.');
  });

  // ======================================================================
  // PROCESO: RegistroServiceWorker
  // Habilita el uso sin conexión y es requisito técnico para que el
  // navegador considere la app "instalable".
  // ======================================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('No se pudo registrar el service worker:', err));
    });
  }

  // ======================================================================
  // MÓDULO: GestorCuaderno
  // Permite trabajar con varias "hojas" (páginas) tipo pestañas, y guardar/
  // abrir el cuaderno completo como un archivo .job (JSON), de modo que
  // se pueda cerrar el navegador y retomar el trabajo después.
  // ======================================================================
  let paginas = [];
  let paginaActivaIndex = 0;
  let contadorPaginas = 0;
  let mostrarFondoImagenGlobal = true;

  function crearPaginaVacia(nombre) {
    contadorPaginas++;
    return {
      nombre: nombre || ('Pág. ' + contadorPaginas),
      fondo: '#d9e8f5',
      dibujo: null, // dataURL PNG del contenido; null = página en blanco
      fondoImagen: null // dataURL PNG de una diapositiva/página de PDF importada, o null
    };
  }

  function actualizarSwatchFondoSeleccionado(color) {
    const c = (color || '#ffffff').toLowerCase();
    swatchesFondo.forEach(s => s.classList.toggle('seleccionado', s.dataset.color.toLowerCase() === c));
  }

  function actualizarBotonInterruptorFondoImagen() {
    const pagina = paginas[paginaActivaIndex];
    const tieneImagen = !!(pagina && pagina.fondoImagen);
    interruptorFondoImagen.classList.toggle('deshabilitado', !tieneImagen);
    interruptorFondoImagen.title = tieneImagen
      ? 'Mostrar u ocultar el fondo importado en esta página'
      : 'Esta página no tiene un fondo importado';
    checkFondoImagen.checked = mostrarFondoImagenGlobal;
  }

  // Guarda el contenido actual del lienzo dentro de los datos de la página activa
  function ProcesoGuardarPaginaActual() {
    if (!paginas[paginaActivaIndex]) return;
    paginas[paginaActivaIndex].dibujo = Pizarra.getCanvasPrincipal().toDataURL('image/png');
    paginas[paginaActivaIndex].fondo = Pizarra.getColorFondo();
  }

  // Carga en el lienzo el contenido guardado de la página indicada
  function ProcesoCargarPagina(index) {
    const pagina = paginas[index];
    if (!pagina) return;
    paginaActivaIndex = index;

    Pizarra.setFondo(pagina.fondo || '#ffffff');
    actualizarSwatchFondoSeleccionado(pagina.fondo || '#ffffff');
    Pizarra.setFondoImagen(pagina.fondoImagen || null);
    Pizarra.mostrarFondoImagen(mostrarFondoImagenGlobal);
    actualizarBotonInterruptorFondoImagen();

    // Limpiar lápiz temporal al cambiar de hoja (es efímero, no pertenece a ninguna página)
    Pizarra.limpiarTemporal();
    desactivarVisualLapizTemporal();

    const canvasP = Pizarra.getCanvasPrincipal();
    const ctxDeCarga = canvasP.getContext('2d');
    ctxDeCarga.clearRect(0, 0, canvasP.width, canvasP.height);

    if (pagina.dibujo) {
      const img = new Image();
      img.onload = () => {
        ctxDeCarga.drawImage(img, 0, 0);
        Pizarra.inicializarHistorial();
        if (typeof emitirContenidoCompleto === 'function') emitirContenidoCompleto();
      };
      img.src = pagina.dibujo;
    } else {
      Pizarra.inicializarHistorial();
      if (typeof emitirContenidoCompleto === 'function') emitirContenidoCompleto();
    }

    RenderizarPestanas();
  }

  function ProcesoCambiarPagina(index) {
    if (index === paginaActivaIndex) return;
    ProcesoGuardarPaginaActual();
    ProcesoCargarPagina(index);
  }

  function ProcesoNuevaPagina() {
    ProcesoGuardarPaginaActual();
    paginas.push(crearPaginaVacia());
    ProcesoCargarPagina(paginas.length - 1);
  }

  function ProcesoEliminarPagina(index, evento) {
    if (evento) evento.stopPropagation();
    if (paginas.length <= 1) {
      alert('El cuaderno debe tener al menos una página.');
      return;
    }
    const nombre = paginas[index].nombre;
    if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`)) return;

    paginas.splice(index, 1);

    if (paginaActivaIndex === index) {
      ProcesoCargarPagina(Math.max(0, index - 1));
    } else {
      if (paginaActivaIndex > index) paginaActivaIndex--;
      RenderizarPestanas();
    }
  }

  function RenderizarPestanas() {
    barraPestanas.innerHTML = '';
    paginas.forEach((pagina, i) => {
      const tab = document.createElement('div');
      tab.className = 'pestana' + (i === paginaActivaIndex ? ' activa' : '');
      tab.innerHTML = `<span>${pagina.nombre}</span><span class="cerrar-pestana" title="Eliminar página">&times;</span>`;
      tab.addEventListener('click', () => ProcesoCambiarPagina(i));
      tab.querySelector('.cerrar-pestana').addEventListener('click', (e) => ProcesoEliminarPagina(i, e));
      barraPestanas.appendChild(tab);
    });

    const btnNueva = document.createElement('div');
    btnNueva.className = 'btn-nueva-pestana';
    btnNueva.title = 'Nueva página';
    btnNueva.innerHTML = '<i class="fas fa-plus"></i>';
    btnNueva.addEventListener('click', () => ProcesoNuevaPagina());
    barraPestanas.appendChild(btnNueva);
  }

  // ===== Guardar cuaderno completo como archivo .job =====
  function ProcesoGuardarCuaderno() {
    ProcesoGuardarPaginaActual();
    const cuaderno = {
      tipo: 'cuaderno-pizarra-jb',
      version: 1,
      autor: 'Mat. Edgar Johni Bustamante Romero, Ph.D.',
      fecha: new Date().toISOString(),
      paginaActivaIndex,
      paginas: paginas.map(p => ({ nombre: p.nombre, fondo: p.fondo, dibujo: p.dibujo, fondoImagen: p.fondoImagen || null }))
    };
    const blob = new Blob([JSON.stringify(cuaderno)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const marca = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    const a = document.createElement('a');
    a.href = url;
    a.download = `cuaderno-pizarra-${marca}.job`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // ===== Abrir cuaderno desde archivo .job (compatible también con .pizarra) =====
  function ProcesoAbrirCuaderno(file) {
    if (!file) return;
    const lector = new FileReader();
    lector.onload = (e) => {
      try {
        const datos = JSON.parse(e.target.result);
        if (!datos || !Array.isArray(datos.paginas) || datos.paginas.length === 0) {
          alert('El archivo no parece un cuaderno válido de esta pizarra.');
          return;
        }
        paginas = datos.paginas.map((p, i) => ({
          nombre: p.nombre || ('Pág. ' + (i + 1)),
          fondo: p.fondo || '#ffffff',
          dibujo: p.dibujo || null,
          fondoImagen: p.fondoImagen || null
        }));
        contadorPaginas = paginas.length;
        const indiceInicial = Number.isInteger(datos.paginaActivaIndex)
          ? Math.min(Math.max(datos.paginaActivaIndex, 0), paginas.length - 1)
          : 0;
        ProcesoCargarPagina(indiceInicial);
      } catch (err) {
        alert('No se pudo abrir el cuaderno: el archivo está dañado o no tiene el formato correcto.');
      }
    };
    lector.readAsText(file);
  }

  bindButton(btnGuardarCuaderno, () => ProcesoGuardarCuaderno());
  bindButton(btnAbrirCuaderno, () => inputAbrirCuaderno.click());
  inputAbrirCuaderno.addEventListener('change', (e) => {

  // ======================================================================
  // MÓDULO: ImportarPDF
  // Importa un PDF y convierte cada una de sus páginas en el fondo de una
  // hoja nueva del cuaderno (una página del PDF = una página del cuaderno).
  // Ese fondo es independiente del color de fondo y del dibujo: se puede
  // mostrar u ocultar con el interruptor, sin perder nada de lo dibujado.
  // ======================================================================
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  // Dibuja una página del PDF a buena resolución y la encaja (sin
  // deformarla) dentro del tablero de 1200x700, centrada, con los
  // márgenes transparentes para que se siga viendo el color de fondo.
  function renderizarPaginaPDF(paginaPdf) {
    return new Promise((resolve, reject) => {
      const viewportBase = paginaPdf.getViewport({ scale: 1 });
      const escala = 1600 / Math.max(viewportBase.width, viewportBase.height);
      const viewport = paginaPdf.getViewport({ scale: escala });

      const canvasTemp = document.createElement('canvas');
      canvasTemp.width = viewport.width;
      canvasTemp.height = viewport.height;
      const ctxTemp = canvasTemp.getContext('2d');

      paginaPdf.render({ canvasContext: ctxTemp, viewport }).promise.then(() => {
        const W = Pizarra.W, H = Pizarra.H;
        const escalaEncaje = Math.min(W / canvasTemp.width, H / canvasTemp.height);
        const anchoFinal = canvasTemp.width * escalaEncaje;
        const altoFinal = canvasTemp.height * escalaEncaje;
        const x = (W - anchoFinal) / 2;
        const y = (H - altoFinal) / 2;

        const canvasFinal = document.createElement('canvas');
        canvasFinal.width = W;
        canvasFinal.height = H;
        const ctxFinal = canvasFinal.getContext('2d');
        ctxFinal.drawImage(canvasTemp, x, y, anchoFinal, altoFinal);

        resolve(canvasFinal.toDataURL('image/png'));
      }).catch(reject);
    });
  }

  async function ProcesoImportarPDF(file) {
    if (!file) return;
    if (typeof window.estaActivado === 'function' && !window.estaActivado()) {
      alert('Esta función requiere activación. Usa el candado en el menú superior para ingresar tu código.');
      return;
    }
    if (typeof pdfjsLib === 'undefined') {
      alert('No se pudo cargar el lector de PDF. Verifica tu conexión a internet e inténtalo de nuevo.');
      return;
    }
    const iconoOriginal = btnImportarPDF.innerHTML;
    btnImportarPDF.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    btnImportarPDF.disabled = true;
    try {
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;

      const imagenesNuevas = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const paginaPdf = await pdf.getPage(i);
        const imagen = await renderizarPaginaPDF(paginaPdf);
        imagenesNuevas.push(imagen);
      }

      ProcesoGuardarPaginaActual(); // no perder lo que estabas trabajando
      const indicePrimeraNueva = paginas.length;
      const nombreBase = file.name.replace(/\.pdf$/i, '');
      imagenesNuevas.forEach((imagen, i) => {
        const nueva = crearPaginaVacia(`${nombreBase} · ${i + 1}`);
        nueva.fondoImagen = imagen;
        paginas.push(nueva);
      });
      mostrarFondoImagenGlobal = true;
      ProcesoCargarPagina(indicePrimeraNueva);
    } catch (err) {
      console.error(err);
      alert('No se pudo importar el PDF. Verifica que el archivo no esté dañado ni protegido con contraseña.');
    } finally {
      btnImportarPDF.innerHTML = iconoOriginal;
      btnImportarPDF.disabled = false;
    }
  }

  bindButton(btnImportarPDF, () => inputImportarPDF.click());
  inputImportarPDF.addEventListener('change', (e) => {

  checkFondoImagen.addEventListener('change', () => {

  // ======================================================================

  // ======================================================================
  // PROCESO: ProcesoPantallaCompleta
  // Activa/desactiva el modo de pantalla completa del navegador.
  // ======================================================================
  function ProcesoPantallaCompleta() {
    const elemento = document.documentElement;
    const enPantallaCompleta = document.fullscreenElement || document.webkitFullscreenElement;

    if (!enPantallaCompleta) {
      const solicitar = elemento.requestFullscreen || elemento.webkitRequestFullscreen;
      if (solicitar) {
        solicitar.call(elemento).catch(err => {
          alert('No se pudo activar la pantalla completa: ' + err.message);
        });
      }
    } else {
      const salir = document.exitFullscreen || document.webkitExitFullscreen;
      if (salir) salir.call(document);
    }
  }
  bindButton(btnPantallaCompleta, () => ProcesoPantallaCompleta());

  function actualizarIconoPantallaCompleta() {
    const activo = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const icono = btnPantallaCompleta.querySelector('i');
    icono.className = activo ? 'fas fa-compress' : 'fas fa-expand';
    btnPantallaCompleta.title = activo ? 'Salir de pantalla completa' : 'Modo pantalla completa';
  }
  document.addEventListener('fullscreenchange', actualizarIconoPantallaCompleta);

  // ===== Herramienta "Neutro" =====
  // Botón en blanco: al activarlo, ninguna herramienta de dibujo queda
  // seleccionada. El lienzo no reacciona a clics ni trazos: es un estado
  // de "pausa" para mover la vista o simplemente no dibujar por accidente.
  bindButton(btnNeutro, () => setTool('neutro', btnNeutro));

  // ======================================================================
  // PROCESO: ProcesoAjustarPantalla
  // Escala todo el pizarrón (menús + hoja + pestañas) para que quepa por
  // completo en la ventana visible, sin importar el tamaño de pantalla.
  // Así se elimina la necesidad de cualquier deslizador (scroll) del
  // sistema, tanto vertical como horizontal.
  // ======================================================================
  const pizarraWrapper = document.querySelector('.pizarra-wrapper');
  let anchoNaturalWrapper = null;
  let altoNaturalWrapper = null;

  function ProcesoAjustarPantalla() {
    if (anchoNaturalWrapper === null) {
      const transformPrevia = pizarraWrapper.style.transform;
      pizarraWrapper.style.transform = 'none';
      const rect = pizarraWrapper.getBoundingClientRect();
      anchoNaturalWrapper = rect.width;
      altoNaturalWrapper = rect.height;
      pizarraWrapper.style.transform = transformPrevia;
    }

    const margen = 16; // pequeño respiro para que no quede pegado a los bordes
    const escalaAncho = (window.innerWidth - margen) / anchoNaturalWrapper;
    const escalaAlto = (window.innerHeight - margen) / altoNaturalWrapper;
    const escala = Math.min(1, escalaAncho, escalaAlto); // nunca agranda más allá del 100%

    pizarraWrapper.style.transform = `scale(${escala})`;
  }

  window.addEventListener('resize', ProcesoAjustarPantalla);
  window.addEventListener('orientationchange', ProcesoAjustarPantalla);
  window.addEventListener('load', ProcesoAjustarPantalla);
  ProcesoAjustarPantalla();

  // ===== Título con fecha actual (versión) =====
  (function actualizarTituloConFecha() {
    const hoy = new Date();
    const dd = String(hoy.getDate()).padStart(2, '0');
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');
    const yyyy = hoy.getFullYear();
    document.title = `Pizarra JoB [v: ${dd}/${mm}/${yyyy}]`;
  })();

  // ======================================================================
  // MÓDULO: Lupa (efecto de aumento circular)
  // Muestra, mientras se arrastra el dedo/mouse con la herramienta activa,
  // un círculo de radio ~2cm con una vista aumentada de esa zona exacta
  // del pizarrón (fondo + dibujo + lápiz temporal + cuadrícula).
  // ======================================================================
  const LUPA_RADIO_CM = 2.5; // se aumentó 0.5cm (antes 2cm)
  const PX_POR_CM = 37.8; // aproximación estándar: 96px/pulgada ÷ 2.54cm/pulgada
  const LUPA_RADIO_PX = Math.round(LUPA_RADIO_CM * PX_POR_CM); // ≈ 76px
  const LUPA_DIAMETRO_PX = LUPA_RADIO_PX * 2;
  const LUPA_ZOOM = 2.2; // cuánto se aumenta el contenido dentro de la lupa

  // Tamaño físico del lente (constante, independiente del zoom del lienzo)
  lupaOverlay.style.width = LUPA_DIAMETRO_PX + 'px';
  lupaOverlay.style.height = LUPA_DIAMETRO_PX + 'px';
  lupaCanvas.width = LUPA_DIAMETRO_PX;
  lupaCanvas.height = LUPA_DIAMETRO_PX;

  let lupaArrastrando = false;

  function ProcesoActivarLupa() {
    const yaActiva = btnLupa.classList.contains('activo');
    if (yaActiva) {
      btnLupa.classList.remove('activo');
      lupaOverlay.style.display = 'none';
      setTool('lapiz', btnLapiz);
      return;
    }
    setTool('lupa', btnLupa);
  }
  bindButton(btnLupa, () => ProcesoActivarLupa());

  // Si se activa cualquier otra herramienta del menú vertical, ocultar la lupa
  barraLateral.addEventListener('click', () => {
    if (!btnLupa.classList.contains('activo')) {
      lupaOverlay.style.display = 'none';
      lupaArrastrando = false;
    }
  });

  function coordenadasLupa(e) {
    const rect = contenedor.getBoundingClientRect();
    const scaleX = Pizarra.W / rect.width;
    const scaleY = Pizarra.H / rect.height;
    let cx, cy;
    if (e.touches && e.touches.length) {
      cx = e.touches[0].clientX; cy = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length) {
      cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
    } else {
      cx = e.clientX; cy = e.clientY;
    }
    const xLocal = (cx - rect.left) * scaleX; // posición dentro del contenedor (para ubicar el lente)
    const yLocal = (cy - rect.top) * scaleY;
    const { zoom, panX, panY } = Pizarra.getTransform();
    const xCanvas = (xLocal - panX) / zoom; // posición real en el lienzo (para recortar el contenido)
    const yCanvas = (yLocal - panY) / zoom;
    return { xLocal, yLocal, xCanvas, yCanvas };
  }

  function dibujarLupa(xCanvas, yCanvas) {
    const { zoom } = Pizarra.getTransform();
    // Si el lienzo ya está con zoom aplicado, cada píxel del canvas ocupa
    // más (o menos) espacio en pantalla; hay que compensarlo para que el
    // aumento de la lupa sea siempre el mismo, sin importar el zoom del lienzo.
    const radioFuente = LUPA_RADIO_PX / (LUPA_ZOOM * zoom);
    const sx = xCanvas - radioFuente;
    const sy = yCanvas - radioFuente;
    const s = radioFuente * 2;

    ctxLupa.clearRect(0, 0, LUPA_DIAMETRO_PX, LUPA_DIAMETRO_PX);
    // Se recompone en el mismo orden visual: fondo → dibujo → lápiz temporal → cuadrícula
    [Pizarra.getCanvasFondo(), Pizarra.getCanvasPrincipal(), Pizarra.getCanvasTemporal(), Pizarra.getCanvasGrid()]
      .forEach(capa => ctxLupa.drawImage(capa, sx, sy, s, s, 0, 0, LUPA_DIAMETRO_PX, LUPA_DIAMETRO_PX));
    return radioFuente;
  }

  function actualizarLupa(e) {
    const { xLocal, yLocal, xCanvas, yCanvas } = coordenadasLupa(e);
    lupaOverlay.style.left = (xLocal - LUPA_RADIO_PX) + 'px';
    lupaOverlay.style.top = (yLocal - LUPA_RADIO_PX) + 'px';
    const radioFuente = dibujarLupa(xCanvas, yCanvas);
    // Transmitir al Pizarrón 2, para que la lupa también se vea allá
    // (esta herramienta es justamente para interactuar con los estudiantes).
    if (typeof emitirLupa === 'function') emitirLupa(xCanvas, yCanvas, radioFuente, true);
  }

  function lupaPointerDown(e) {
    if (!btnLupa.classList.contains('activo')) return;
    lupaArrastrando = true;
    lupaOverlay.style.display = 'block';
    actualizarLupa(e);
  }
  function lupaPointerMove(e) {
    if (!btnLupa.classList.contains('activo') || !lupaArrastrando) return;
    actualizarLupa(e);
  }
  function lupaPointerUp() {
    lupaArrastrando = false;
    if (btnLupa.classList.contains('activo')) {
      lupaOverlay.style.display = 'none';
      if (typeof emitirLupa === 'function') emitirLupa(0, 0, 0, false);
    }
  }

  contenedor.addEventListener('mousedown', lupaPointerDown);
  contenedor.addEventListener('touchstart', lupaPointerDown, { passive: false });
  window.addEventListener('mousemove', lupaPointerMove);
  window.addEventListener('touchmove', lupaPointerMove, { passive: false });
  window.addEventListener('mouseup', lupaPointerUp);
  window.addEventListener('touchend', lupaPointerUp);

  // ======================================================================
  // MÓDULO: PizarronEspejo
  // Sincroniza el contenido y un marcador de posición con una segunda
  // pestaña ("Pizarrón 2"), pensada para mostrar a los estudiantes una
  // vista limpia mientras el profesor trabaja cómodamente en el Pizarrón 1.
  // ======================================================================
  const CM_A_PX = 37.795; // aproximación estándar 96dpi (1cm ≈ 37.795 px)
  const MARCADOR_ANCHO_TABLERO = 6 * CM_A_PX;   // 6cm de largo (horizontal) — duplicado
  const MARCADOR_ALTO_TABLERO = 1.5 * CM_A_PX;  // 1.5cm de ancho (vertical)

  const CANAL_SYNC = 'pizarron-jb-sync';
  const CLAVE_CONTENIDO = 'pizarron_jb_sync_contenido';
  const CLAVE_MARCADOR = 'pizarron_jb_sync_marcador';

  const canalSync = ('BroadcastChannel' in window) ? new BroadcastChannel(CANAL_SYNC) : null;
  let marcadorVisible = false;

  // ======================================================================
  // Detección automática de si el Pizarrón 2 sigue abierto ("latido").
  // Mientras no haya un Pizarrón 2 activo, NO se hace ningún trabajo de
  // sincronización (ni componer imagen, ni tocar localStorage, ni
  // transmitir) — así se evita cualquier costo en equipos más modestos
  // (p. ej. pantallas táctiles de aula) cuando nadie está mirando la
  // segunda pantalla.
  // ======================================================================
  const UMBRAL_INACTIVIDAD_P2 = 12000; // ms sin señal del Pizarrón 2 = se da por cerrado
  let pizarron2Activo = false;
  let ultimaSenalP2 = 0;

  function marcarPizarron2Activo() {
    ultimaSenalP2 = Date.now();
    if (!pizarron2Activo) {
      pizarron2Activo = true;
      // Recién detectado (o recién reconectado): manda el estado completo
      // de inmediato, sin esperar al próximo trazo.
      emitirContenidoCompleto(false);
      if (marcadorVisible) emitirMarcadorCompleto();
    }
  }
  function marcarPizarron2Inactivo() {
    pizarron2Activo = false;
  }
  function forzarPizarron2Activo() {
    // Usado por acciones explícitas del profesor (abrir / actualizar),
    // para que funcionen de inmediato sin esperar el próximo latido.
    pizarron2Activo = true;
    ultimaSenalP2 = Date.now();
  }

  if (canalSync) {
    canalSync.onmessage = (ev) => {
      const datos = ev.data;
      if (!datos) return;
      if (datos.tipo === 'conectado' || datos.tipo === 'ping') marcarPizarron2Activo();
      else if (datos.tipo === 'desconectado') marcarPizarron2Inactivo();
    };
  }

  // Vigilante: si no llega señal del Pizarrón 2 en un buen rato, se asume
  // cerrado (cubre el caso de que la pestaña se haya cerrado de golpe,
  // sin avisar).
  setInterval(() => {
    if (pizarron2Activo && (Date.now() - ultimaSenalP2 > UMBRAL_INACTIVIDAD_P2)) {
      marcarPizarron2Inactivo();
    }
  }, 4000);

  // Compone fondo + dibujo + lápiz temporal en una sola imagen plana,
  // igual que se hace para imprimir: así el Pizarrón 2 solo necesita
  // mostrar una <img>, sin tener que recomponer capas.
  // modoRapido=true → JPEG de calidad media (rápido, para actualizaciones
  // en vivo mientras se traza). modoRapido=false → PNG (calidad completa,
  // para el resultado final de cada trazo).
  function generarImagenPlanaActual(modoRapido, callback) {
    const canvasExport = document.createElement('canvas');
    canvasExport.width = Pizarra.W;
    canvasExport.height = Pizarra.H;
    const ctxExport = canvasExport.getContext('2d');
    ctxExport.fillStyle = Pizarra.getColorFondo() || '#ffffff';
    ctxExport.fillRect(0, 0, Pizarra.W, Pizarra.H);
    if (Pizarra.tieneFondoImagenActivo()) {
      ctxExport.drawImage(Pizarra.getCanvasImagenFondo(), 0, 0);
    }
    ctxExport.drawImage(Pizarra.getCanvasPrincipal(), 0, 0);
    ctxExport.drawImage(Pizarra.getCanvasTemporal(), 0, 0);
    callback(modoRapido ? canvasExport.toDataURL('image/jpeg', 0.6) : canvasExport.toDataURL('image/png'));
  }

  function emitirContenidoCompleto(modoRapido) {
    if (!pizarron2Activo) return; // nadie mirando: no se hace ningún trabajo
    // setTimeout(...,0): cede el turno al navegador para que primero
    // termine de pintar el trazo en curso, y recién después componga/
    // codifique la imagen — evita que esto se sienta en el trazo.
    setTimeout(() => {
      if (!pizarron2Activo) return; // pudo desconectarse durante la espera
      generarImagenPlanaActual(modoRapido, (imagen) => {
        const datos = {
          tipo: 'contenido',
          imagen,
          ts: Date.now(),
          paginaNumero: paginaActivaIndex + 1,
          totalPaginas: paginas.length
        };
        if (canalSync) canalSync.postMessage(datos);
        // El localStorage (síncrono y más costoso) solo se usa para la
        // versión final de calidad completa, no en cada actualización viva.
        if (!modoRapido) {
          try { localStorage.setItem(CLAVE_CONTENIDO, JSON.stringify(datos)); } catch (e) { /* almacenamiento no disponible */ }
        }
      });
    }, 0);
  }

  function emitirMarcadorCompleto() {
    if (!pizarron2Activo) return; // nadie mirando: no se hace ningún trabajo
    const centro = Pizarra.getPuntoDeCentroEnTablero();
    const datos = {
      tipo: 'marcador',
      x: centro.x, y: centro.y,
      ancho: MARCADOR_ANCHO_TABLERO, alto: MARCADOR_ALTO_TABLERO,
      visible: marcadorVisible,
      ts: Date.now()
    };
    if (canalSync) canalSync.postMessage(datos);
    try { localStorage.setItem(CLAVE_MARCADOR, JSON.stringify(datos)); } catch (e) { /* almacenamiento no disponible */ }
  }

  // Transmite la posición/estado de la lupa al Pizarrón 2, para que los
  // estudiantes vean el mismo efecto de aumento mientras el profesor
  // señala algo — es justamente el propósito de esta herramienta.
  // No se guarda en localStorage (posición muy efímera, cambia decenas de
  // veces por segundo); solo viaja por el canal en vivo.
  function emitirLupa(x, y, radioFuente, visible) {
    if (!pizarron2Activo) return;
    if (canalSync) canalSync.postMessage({ tipo: 'lupa', x, y, radioFuente, visible, ts: Date.now() });
  }

  // Dibuja (o esconde) el marcador también en el propio Pizarrón 1
  function dibujarMarcadorLocal() {
    ctxMarcador.clearRect(0, 0, Pizarra.W, Pizarra.H);
    if (!marcadorVisible) {
      canvasMarcador.style.display = 'none';
      return;
    }
    canvasMarcador.style.display = 'block';
    const centro = Pizarra.getPuntoDeCentroEnTablero();
    const x = centro.x - MARCADOR_ANCHO_TABLERO / 2;
    const y = centro.y - MARCADOR_ALTO_TABLERO / 2;
    ctxMarcador.save();
    ctxMarcador.fillStyle = 'rgba(37, 99, 235, 0.14)';
    ctxMarcador.strokeStyle = 'rgba(37, 99, 235, 0.55)';
    ctxMarcador.lineWidth = 2;
    const r = 10;
    ctxMarcador.beginPath();
    ctxMarcador.roundRect(x, y, MARCADOR_ANCHO_TABLERO, MARCADOR_ALTO_TABLERO, r);
    ctxMarcador.fill();
    ctxMarcador.stroke();
    ctxMarcador.restore();
  }

  // ===== Conectar los hooks del módulo Pizarra =====
  Pizarra.setOnCambioContenido(() => emitirContenidoCompleto(false));
  Pizarra.setOnCambioTransform(() => {
    if (!marcadorVisible) return;
    dibujarMarcadorLocal();
    emitirMarcadorCompleto();
  });

  // Mientras se está trazando (pincel, resaltador, lápiz temporal, formas...)
  // se transmite periódicamente en modo rápido (JPEG, sin localStorage),
  // para que el Pizarrón 2 vea el trazo avanzar casi en vivo. Si no hay
  // Pizarrón 2 activo, emitirContenidoCompleto no hace absolutamente nada.
  setInterval(() => {
    if (Pizarra.estaDibujando()) emitirContenidoCompleto(true);
  }, 150);

  // ===== Botón: Abrir Pizarrón 2 en otra pestaña =====
  function ProcesoAbrirPizarron2() {
    window.open('pizarron2.html', '_blank');
    forzarPizarron2Activo();
    // Pequeño respiro y luego reenviar el estado completo, para que la
    // pestaña recién abierta reciba contenido aunque llegue tarde al canal.
    setTimeout(() => {
      emitirContenidoCompleto(false);
      emitirMarcadorCompleto();
    }, 800);
  }
  bindButton(btnAbrirPizarron2, () => ProcesoAbrirPizarron2());

  // ===== Botón: Actualizar (fuerza reenvío) + mostrar/ocultar marcador =====
  function ProcesoActualizarYMarcador() {
    marcadorVisible = !marcadorVisible;
    btnActualizarMarcador.classList.toggle('activo', marcadorVisible);
    forzarPizarron2Activo();
    dibujarMarcadorLocal();
    emitirContenidoCompleto(false);
    emitirMarcadorCompleto();
  }
  bindButton(btnActualizarMarcador, () => ProcesoActualizarYMarcador());

  // ======================================================================
  // PROCESO: ProcesoMoverVista
  // Desplaza la vista del tablero por pasos exactos, usando el tamaño del
  // rectángulo marcador como referencia (y escalando con el zoom actual,
  // para que el paso se sienta igual de "grande" a cualquier nivel de zoom).
  // Horizontal: 3/4 del largo del rectángulo. Vertical: un ancho completo.
  // ======================================================================
  function ProcesoMoverVista(dx, dy) {
    const { zoom } = Pizarra.getTransform();
    Pizarra.moverVista(dx * zoom, dy * zoom);
  }
  bindButton(btnMoverIzquierda, () => ProcesoMoverVista(MARCADOR_ANCHO_TABLERO * 0.75, 0));
  bindButton(btnMoverDerecha, () => ProcesoMoverVista(-MARCADOR_ANCHO_TABLERO * 0.75, 0));
  bindButton(btnMoverArriba, () => ProcesoMoverVista(0, MARCADOR_ALTO_TABLERO));
  bindButton(btnMoverAbajo, () => ProcesoMoverVista(0, -MARCADOR_ALTO_TABLERO));

  // ===== Función para actualizar el indicador de zoom =====
  function actualizarIndicadorZoom() {
    const zoom = Pizarra.getTransform().zoom;
    const porcentaje = Math.round(zoom * 100);
    const indicador = document.getElementById('indicadorZoom');
    if (indicador) indicador.textContent = porcentaje + '%';
  }

  // ===== Inicialización =====
  Pizarra.setHerramienta('neutro', 'principal');
  Pizarra.setColor('#1a1a1a');
  Pizarra.setGrosor(3, 'principal');
  Pizarra.setOpacidad(100, 'principal');
  Pizarra.setFondo('#d9e8f5');

  Pizarra.inicializarHistorial();

  [toggleGrupo1, toggleGrupo2].forEach(t => t.querySelector('i:first-child').className = 'fas fa-chevron-down');
  selectorCP.actualizarBotonesPanel();

  // El cuaderno arranca con una sola página en blanco (la que ya está dibujada)
  paginas = [crearPaginaVacia('Pág. 1')];
  paginaActivaIndex = 0;
  RenderizarPestanas();
  actualizarBotonInterruptorFondoImagen();

  // Inicializar el indicador de zoom
  actualizarIndicadorZoom();

  console.log('✅ Versión con CP (Copiar/Cortar), impresión reparada e indicador de zoom.');
})();
</script>
</body>
</html>
